<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Subscription Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center">Add Subscription Plan</h2>

    <form method="POST" class="space-y-4">

        <div>
            <label class="block text-sm font-medium mb-1">Plan Name</label>
            <input type="text" name="name" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Price</label>
            <input type="number" step="0.01" name="price" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Storage</label>
            <input type="text" name="size" placeholder="e.g. 5 GB" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Duration (days)</label>
            <input type="number" name="duration" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Features</label>
            <textarea name="features"
                      class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            Save Plan
        </button>

    </form>
</div>

</body>
</html>
