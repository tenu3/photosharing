<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Subscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">

    <h2 class="text-2xl font-bold mb-6 text-center">Edit Subscription</h2>

    <form method="POST">

        <div class="mb-4">
            <label class="block text-sm font-medium">Plan Name</label>
            <input type="text" name="name" value="{{ plan.name }}"
                   class="w-full mt-1 px-3 py-2 border rounded-lg" required>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium">Price (₹)</label>
            <input type="number" step="0.01" name="price" value="{{ plan.price }}"
                   class="w-full mt-1 px-3 py-2 border rounded-lg" required>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium">Storage</label>
            <input type="text" name="size" value="{{ plan.size }}"
                   class="w-full mt-1 px-3 py-2 border rounded-lg" required>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium">Duration</label>
            <input type="text" name="duration" value="{{ plan.duration }}"
                   class="w-full mt-1 px-3 py-2 border rounded-lg" required>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium">Features</label>
            <textarea name="features" rows="3"
                      class="w-full mt-1 px-3 py-2 border rounded-lg">{{ plan.features }}</textarea>
        </div>

        <div class="flex justify-between items-center">
            <a href="{{ url_for('manage_subscriptions') }}"
               class="text-blue-600 hover:underline">
                ← Back
            </a>

            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">
                Update
            </button>
        </div>

    </form>
</div>

</body>
</html>
