<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white w-full max-w-md rounded-xl shadow-lg p-8">

    <h2 class="text-2xl font-bold text-center mb-6">Admin Registration</h2>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-4 px-4 py-2 rounded text-sm
                    {% if category == 'success' %}
                        bg-green-100 text-green-700
                    {% else %}
                        bg-red-100 text-red-700
                    {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" autocomplete="off" class="space-y-4">

        <div>
            <label class="block text-sm font-medium mb-1">Name</label>
            <input type="text" name="name" required
                   autocomplete="off"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" name="email" required
                   autocomplete="off"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" name="password" required
                   autocomplete="new-password"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300">
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
            Register
        </button>
    </form>

    <p class="text-sm text-center mt-4">
        Already have an account?
       <a href="{{ url_for('admin_login') }}" class="text-blue-600 hover:underline">
    Login
</a>

    </p>

</div>

</body>
</html>
