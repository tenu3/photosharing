<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | PhotoShare</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        .checkout-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkout-card {
            background: #fff;
            width: 420px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .checkout-card h2 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .price {
            font-size: 36px;
            font-weight: bold;
            margin: 20px 0;
        }

        .details {
            color: #555;
            margin-bottom: 25px;
        }

        .details p {
            margin: 6px 0;
        }

        .pay-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #c7a36b; /* your gold theme */
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .pay-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            margin-top: 15px;
            display: block;
            text-decoration: none;
            color: #777;
            font-size: 14px;
        }
        .proceed-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #D4AF37, #B8962E);
            color: #fff;
            padding: 14px 0;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
        }

        .proceed-btn:hover {
            background: linear-gradient(135deg, #B8962E, #9E7C19);
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(212, 175, 55, 0.5);
        }

    </style>
</head>
<body>

<div class="checkout-wrapper">
    <div class="checkout-card">

        <!-- PLAN NAME -->
        <h2>{{ plan.name }}</h2>

    <p>₹{{ plan.price }}/month</p>

    <p>Storage: {{ plan.storage }} GB</p>
    <p>Duration: {{ plan.duration }} months</p>

        <!-- PAYMENT FORM -->
<a href="{{ url_for('razorpay_pay', plan_id=plan.id) }}"
   class="proceed-btn">
   Proceed to Payment
</a>
 <a href="/pricing" class="back-link">← Back to pricing</a>

    </div>
</div>

</body>
</html>
