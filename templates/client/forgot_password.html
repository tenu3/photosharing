<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | PhotoShare</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont;
        }

        body {
            margin: 0;
            background: #f7f7f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 600;
            color: #111;
        }

        p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #7c3aed;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        .success {
            background: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .back-link a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Forgot your password?</h1>
    <p>
        Enter the email address associated with your account and we’ll send you a link to reset your password.
    </p>

    {% if sent %}
        <div class="success">
            If an account exists with that email, a password reset link has been sent.
            <br><br>
            <small>(Check console during development)</small>
        </div>
    {% else %}
        <form method="POST">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <button type="submit">Send reset link</button>
        </form>
    {% endif %}

    <div class="back-link">
        <a href="{{ url_for('client_login') }}">← Back to login</a>
    </div>
</div>

</body>
</html>
