<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ gallery.title }}</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* HERO */
.hero {
    height: 100vh;
    background-image: url("{{ url_for('static', filename=gallery.cover_photo) }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
}

/* DARK OVERLAY */
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
}

/* CENTER CONTENT */
.hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
}

.hero-content h1 {
    font-size: 48px;
    font-weight: 500;
    margin-bottom: 24px;
}

/* BUTTON */
.hero-content a {
    padding: 14px 36px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    letter-spacing: 1px;
    font-size: 13px;
    transition: 0.3s;
}

.hero-content a:hover {
    background: white;
    color: black;
}
.hero {
    animation: heroFade 1.2s ease-out forwards;
    opacity: 0;
}

@keyframes heroFade {
    from {
        opacity: 0;
        transform: scale(1.02);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.hero-content {
    animation: contentFade 1.1s ease-out forwards;
    animation-delay: 0.4s;
    opacity: 0;
}

@keyframes contentFade {
    from {
        opacity: 0;
        transform: translateY(16px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<div class="hero">
    <div class="hero-content">
        <h1>{{ gallery.title }}</h1>
        <a href="{{ url_for('gallery_photos', gallery_id=gallery.id) }}">
            VIEW GALLERY
        </a>
    </div>
</div>

</body>
</html>
