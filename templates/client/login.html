<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | PhotoShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

<!-- HEADER -->
<header class="px-10 py-6">
    <h1 class="text-2xl tracking-widest font-serif">PHOTOSHARE</h1>
</header>

<!-- PAGE -->
<main class="flex flex-1 items-center justify-center px-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 max-w-5xl w-full">

        <!-- LEFT SIDE -->
        <div class="flex flex-col justify-center">
            <h2 class="text-3xl font-medium mb-3">
                Log in to PhotoShare
            </h2>

            <p class="text-gray-500 mb-8">
                Don’t have an account?
                <a href="{{ url_for('client_register') }}"
                   class="text-emerald-600 hover:underline">
                    Sign up
                </a>
            </p>

            <a href="{{ url_for('google_login') }}"
               class="border border-gray-300 rounded-md py-3 flex items-center justify-center gap-3 hover:bg-gray-50 transition">
                <img
                  src="https://developers.google.com/identity/images/g-logo.png"
                  alt="Google"
                  class="w-5 h-5">
                <span class="text-gray-700 font-medium">
                    Continue with Google
                </span>
            </a>
        </div>

        <!-- RIGHT SIDE -->
        <div class="flex flex-col justify-center max-w-md w-full">

            <div class="flex items-center gap-3 text-gray-400 text-sm mb-6">
                <hr class="flex-1">
                Or use your email
                <hr class="flex-1">
            </div>

            {% if error %}
                <p class="text-red-600 text-sm mb-4">
                    {{ error }}
                </p>
            {% endif %}

            <form method="POST" class="space-y-4">
                <input
                    type="email"
                    name="email"
                    value="{{ email or '' }}"
                    placeholder="Email"
                    required
                    class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                    class="w-full border border-gray-300 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2">
                        <input type="checkbox" class="accent-emerald-600">
                        Remember me
                    </label>
                    <a href="#" class="text-emerald-600 hover:underline">
                        Forgot password?
                    </a>
                </div>

                <button
                    type="submit"
                    class="w-full bg-emerald-600 text-white py-3 rounded-lg hover:bg-emerald-700 transition font-medium">
                    LOGIN
                </button>
            </form>
        </div>

    </div>
</main>

</body>

</html>
