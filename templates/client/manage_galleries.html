<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Galleries</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #f9fafb;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
      font-weight: 600;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .gallery-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      transition: transform 0.25s ease;
      text-decoration: none;
      color: inherit;
    }

    .gallery-card:hover {
      transform: translateY(-4px);
    }

    .gallery-cover {
      height: 180px;
      background: #e5e7eb;
    }

    .gallery-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-body {
      padding: 16px;
    }

    .gallery-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .gallery-meta {
      font-size: 13px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      padding: 80px;
      color: #6b7280;
    }
  </style>
</head>
<body>

<h1>Your Galleries</h1>

{% if galleries %}
  <div class="gallery-grid">
    {% for gallery in galleries %}
      <a
        href="{{ url_for('manage_gallery', gallery_id=gallery.id) }}"
        class="gallery-card"
      >
        <div class="gallery-cover">
          {% if gallery.cover_photo %}
            <img src="{{ url_for('static', filename=gallery.cover_photo) }}">
          {% endif %}
        </div>

        <div class="gallery-body">
          <div class="gallery-title">{{ gallery.title }}</div>
          <div class="gallery-meta">
            {{ gallery.photo_count }} photos
          </div>
        </div>
      </a>
    {% endfor %}
  </div>
{% else %}
  <div class="empty">
    <h2>No galleries yet</h2>
    <p>Create your first gallery to get started.</p>
  </div>
{% endif %}

</body>
</html>
