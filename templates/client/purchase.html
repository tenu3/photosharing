<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Purchase</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .bg-gold { background-color: #c7a36b; }
    .bg-gold:hover { background-color: #c7a36b; }
    .text-gold { color: #c7a36b; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-xl rounded-2xl p-10 w-full max-w-md text-center">

  <h2 class="text-2xl font-bold mb-4">
    Confirm Purchase
  </h2>

  <h3 class="text-xl font-semibold">
    {{ plan.name }}
  </h3>

  <p class="text-3xl text-gold font-bold my-4">
    ₹{{ plan.price }}
  </p>

  <ul class="text-slate-600 mb-6 space-y-2">
    <li>📦 Storage: <b>{{ plan.storage }} GB</b></li>
    <li>⏳ Duration: <b>{{ plan.duration }} days</b></li>
  </ul>

  <form method="POST">
    <button class="w-full bg-gold text-white py-3 rounded-xl font-semibold">
      Confirm Purchase
    </button>
  </form>

  <a href="{{ url_for('upgrade_storage') }}"
     class="block mt-4 text-slate-500 hover:text-slate-800">
    Cancel
  </a>

</div>

</body>
</html>
