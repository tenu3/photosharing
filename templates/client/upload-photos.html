<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Photos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
  <h2 class="text-xl font-semibold mb-4">Upload Photos</h2>

<form id="uploadForm"
  action="{{ url_for('upload_photos', gallery_id=gallery.id) }}"
  method="POST"
  enctype="multipart/form-data">

  <div id="dropzone">Drop photos or click</div>

  <input
    type="file"
    id="fileInput"
    name="photos[]"
    multiple
    hidden
  >
</form>


  <p class="text-sm text-gray-500 mt-3">
    Photos are saved automatically
  </p>
</div>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

// click → file picker
dropzone.onclick = () => fileInput.click();

// drag effects
dropzone.ondragover = e => {
  e.preventDefault();
  dropzone.classList.add("bg-purple-50");
};

dropzone.ondragleave = () =>
  dropzone.classList.remove("bg-purple-50");

// drop upload
dropzone.ondrop = e => {
  e.preventDefault();
  dropzone.classList.remove("bg-purple-50");
  uploadFiles(e.dataTransfer.files);
};

// file picker upload
fileInput.onchange = () =>
  uploadFiles(fileInput.files);

// upload logic
function uploadFiles(files) {
  if (!files.length) return;

  const fd = new FormData();
  for (let file of files) {
    fd.append("photos[]", file);
  }
const form = document.getElementById("uploadForm");

function upload(files) {
  const fd = new FormData(form);

  for (let f of files) {
    fd.append("photos[]", f);
  }

  fetch(form.action, {
    method: "POST",
    body: fd,
    headers: {
      "X-Requested-With": "XMLHttpRequest"
    }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      location.reload();
    } else {
      alert("Upload failed");
    }
  })
  .catch(err => {
    console.error(err);
    alert("Upload error");
  });
}
</script>

</body>
</html>
