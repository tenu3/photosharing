<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Client photo galleries</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
        }

        h1 {
            text-align: center;
            margin: 60px 0 40px;
            font-size: 36px;
        }

        .gallery-grid {
            max-width: 1300px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .gallery-card {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
        }

        .gallery-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.05);
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-card:hover .gallery-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

<h1>Galleries</h1>

<div class="gallery-grid">
    {% for gallery in galleries %}
    <a href="{{ url_for('public_gallery', gallery_id=gallery.id) }}"
       class="gallery-card">

        <img src="{{ url_for('static', filename=gallery.cover_photo) }}">

        <div class="gallery-overlay">
            {{ gallery.title }}
        </div>
    </a>
    {% endfor %}
</div>

</body>
</html>
