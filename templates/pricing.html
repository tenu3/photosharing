<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Upgrade Plans</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f9fafb;
    margin: 0;
}

.container {
    max-width: 1100px;
    margin: 60px auto;
    text-align: center;
}

h1 {
    margin-bottom: 40px;
}

.plans {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
}

.plan {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.plan h2 {
    margin-bottom: 10px;
}

.price {
    font-size: 32px;
    color: #c7a36b;
    margin: 15px 0;
}

.features {
    text-align: left;
    margin: 20px 0;
    color: #555;
}

.features li {
    margin-bottom: 8px;
}

.btn {
    display: inline-block;
    padding: 12px 24px;
    background: #c7a36b;
    color: white;
    text-decoration: none;
    border-radius: 999px;
    margin-top: 15px;
}

.btn:hover {
    opacity: 0.9;
}
</style>
</head>
<body>

<div class="container">
    <h1>Choose Your Plan</h1>

    <div class="plans">
      {% for plan in plans %}
<div class="plan-card {% if loop.index == 2 %}featured{% endif %}">
    <h3>{{ plan.name }}</h3>

    <div class="price">
        ₹{{ plan.price }} <span>/month</span>
    </div>

    <ul>
        <li>{{ plan.storage_gb}} GB Storage</li>
        <li>{{ plan.duration }} days</li>
        <li>{{ plan.features }}</li>
    </ul>

    <a href="{{ url_for('subscribe_form', plan_id=plan.id) }}" class="btn">
    Upgrade Now
</a>

</div>
{% endfor %}

    </div>
</div>

</body>
</html>
