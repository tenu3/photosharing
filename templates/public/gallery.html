<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ gallery.title }} | PhotoShare</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #fff;
  color: #111;
}

/* HEADER */
.header {
  padding: 30px 20px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header span {
  font-size: 13px;
  color: #6b7280;
}

/* GRID */
.gallery {
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 22px;
}

.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .25s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* SIMILAR SEARCH */
.similar-search {
  text-align: center;
  margin: 25px 0;
}

.upload-box {
  display: inline-block;
  background: #111;
  color: white;
  padding: 12px 26px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  transition: .25s;
}

.upload-box:hover {
  background: #c7a36b;
  color: black;
}

/* RESULT CARD */
.similar-card {
  position: relative;
}

/* SCORE BADGE */
.score-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}

/* SLIDESHOW BUTTON */
.slideshow-bar {
  display: flex;
  justify-content: center;
  margin: 30px 0 10px;
}

.slideshow-btn {
  background: #111;
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 999px;
  font-size: 14px;
  cursor: pointer;
  transition: .25s;
}

.slideshow-btn:hover {
  background: #c7a36b;
  color: #000;
}

/* SLIDESHOW MODAL */
.slideshow-modal {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #111 0%, #000 80%);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.slideshow-modal img {
  max-width: 92%;
  max-height: 88%;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.close-btn {
  position: absolute;
  top: 25px;
  right: 35px;
  color: white;
  font-size: 40px;
  cursor: pointer;
}

.nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 48px;
  cursor: pointer;
  padding: 10px 18px;
}

.nav.prev { left: 25px; }
.nav.next { right: 25px; }

/* LOADING */
.loading {
  text-align: center;
  color: #666;
  padding: 30px;
  font-size: 14px;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 30px;
  font-size: 13px;
  color: #6b7280;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>{{ gallery.title }}</h1>
  <span>Shared via PhotoShare</span>
</div>

<!-- SLIDESHOW -->
<div class="slideshow-bar">
  <button onclick="openSlideshow(0)" class="slideshow-btn">
    ▶ Start Slideshow
  </button>
</div>

<!-- SIMILAR SEARCH -->
<div class="similar-search">
  <label class="upload-box">
    🔍 Search Similar Images
    <input type="file" id="similarInput" hidden accept="image/*">
  </label>
</div>

<!-- RESULTS -->
<div id="similarResults" class="gallery"></div>

<!-- GALLERY GRID -->
<div class="gallery">
  {% for photo in photos %}
  <img
    src="{{ url_for('static', filename=photo.photo_path) }}"
    onclick="openSlideshow({{ loop.index0 }})"
    class="gallery-img">
  {% endfor %}
</div>

<!-- SLIDESHOW MODAL -->
<div id="slideshowModal" class="slideshow-modal">
  <span class="close-btn" onclick="closeSlideshow()">×</span>
  <img id="slideImage">
  <div class="nav prev" onclick="changeSlide(-1)">❮</div>
  <div class="nav next" onclick="changeSlide(1)">❯</div>
</div>

<div class="footer">
  © {{ gallery.title }} · Powered by PhotoShare
</div>

<script>
/* ================= SLIDESHOW ================= */
let slideshowPhotos = [
{% for photo in photos %}
  "{{ url_for('static', filename=photo.photo_path) }}",
{% endfor %}
];

let currentSlide = 0;

function openSlideshow(index) {
  currentSlide = index;
  document.getElementById("slideshowModal").style.display = "flex";
  showSlide();
}

function closeSlideshow() {
  document.getElementById("slideshowModal").style.display = "none";
}

function showSlide() {
  document.getElementById("slideImage").src = slideshowPhotos[currentSlide];
}

function changeSlide(step) {
  currentSlide = (currentSlide + step + slideshowPhotos.length) % slideshowPhotos.length;
  showSlide();
}

/* ================= SIMILAR SEARCH ================= */
document.getElementById("similarInput")
  .addEventListener("change", async function () {

    const file = this.files[0];
    if (!file) return;

    const container = document.getElementById("similarResults");
    container.innerHTML = "<div class='loading'>🔎 Finding best matches...</div>";

    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch(
      "/gallery/{{ gallery.id }}/search-similar",
      { method: "POST", body: formData }
    );

    const data = await res.json();
    container.innerHTML = "";

    if (!data.success || data.results.length === 0) {
      container.innerHTML =
        "<p style='text-align:center;color:#666'>No similar images found</p>";
      return;
    }

    /* 🔥 IMPORTANT: use results as slideshow source */
    slideshowPhotos = data.results.map(p => "/static/" + p.path);

    data.results.forEach((p, index) => {
      const wrapper = document.createElement("div");
      wrapper.className = "similar-card";

      const img = document.createElement("img");
      img.src = "/static/" + p.path;
      img.className = "gallery-img";
      img.onclick = () => openSlideshow(index);

      const badge = document.createElement("div");

      const percent = Math.round(p.score);

      let color = "#dc2626";
      if (percent >= 95) color = "#16a34a";
      else if (percent >= 85) color = "#ca8a04";

      badge.className = "score-badge";
      badge.style.background = color;
      badge.innerText = percent + "% match";

      wrapper.appendChild(img);
      wrapper.appendChild(badge);
      container.appendChild(wrapper);
    });

    container.scrollIntoView({ behavior: "smooth" });
});
</script>

</body>
</html>
