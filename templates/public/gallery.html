<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ gallery.title }} | PhotoShare</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #fff;
  color: #111;
}

/* HEADER */
.header {
  padding: 30px 20px;
  text-align: center;
  border-bottom: 1px solid #eee;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header span {
  font-size: 13px;
  color: #6b7280;
}

/* GRID */
.gallery {
  max-width: 1400px;
  margin: 40px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 22px;
}

.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .3s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 90%;
  max-height: 85vh;
  border-radius: 8px;
}

.close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 32px;
  color: white;
  cursor: pointer;
}

.nav {
  position: absolute;
  top: 50%;
  font-size: 46px;
  color: white;
  background: none;
  border: none;
  cursor: pointer;
}

.prev { left: 30px; }
.next { right: 30px; }

/* FOOTER */
.footer {
  text-align: center;
  padding: 30px;
  font-size: 13px;
  color: #6b7280;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>{{ gallery.title }}</h1>
  <span>Shared via PhotoShare</span>
</div>

<!-- GALLERY GRID -->
<div class="gallery">
  {% for photo in photos %}
    <img
      src="{{ url_for('static', filename=photo.photo_path) }}"
      onclick="openLightbox({{ loop.index0 }})">
  {% endfor %}
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">×</span>
  <button class="nav prev" onclick="prev()">‹</button>
  <img id="lightbox-img">
  <button class="nav next" onclick="next()">›</button>
</div>

<div class="footer">
  © {{ gallery.title }} · Powered by PhotoShare
</div>

<script>
const images = document.querySelectorAll(".gallery img");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
let index = 0;

function openLightbox(i) {
  index = i;
  lightboxImg.src = images[index].src;
  lightbox.classList.add("active");
}

function closeLightbox() {
  lightbox.classList.remove("active");
}

function next() {
  index = (index + 1) % images.length;
  lightboxImg.src = images[index].src;
}

function prev() {
  index = (index - 1 + images.length) % images.length;
  lightboxImg.src = images[index].src;
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});
</script>

</body>
</html>
