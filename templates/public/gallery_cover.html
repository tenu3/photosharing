<!DOCTYPE html>
<html>
<head>
    <title>{{ gallery.title }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .hero {
            height: 100vh;
            background: url('{{ url_for("static", filename=gallery.cover_photo) }}')
                        center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .overlay {
            background: rgba(0,0,0,0.45);
            padding: 60px;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
        }
        .btn:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="overlay">
        <h1>{{ gallery.title }}</h1>
        <p>{{ gallery.created_at.strftime('%B %d, %Y') }}</p>

        <a href="{{ url_for('view_gallery', gallery_id=gallery.id) }}"
           class="btn">
           View Gallery
        </a>
    </div>
</div>

</body>
</html>
