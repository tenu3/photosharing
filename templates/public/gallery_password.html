<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ gallery.title }} | Private Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= BASE ================= */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  height:100vh;
  overflow:hidden;
  color:white;
}

/* ================= BACKGROUND ================= */
.bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    url("{{ url_for('static', filename='images/gallery-cover.jpg') }}")
    center/cover no-repeat;
  filter:blur(2px);
  transform:scale(1.05);
}

/* ================= CENTER WRAP ================= */
.wrap{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* ================= GLASS CARD ================= */
.card{
  width:100%;
  max-width:420px;
  padding:48px 42px;
  border-radius:24px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 40px 120px rgba(0,0,0,.6);

  text-align:center;
  animation:fadeUp .7s ease;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= LOCK ICON ================= */
.lock{
  font-size:42px;
  margin-bottom:14px;
}

/* ================= TITLE ================= */
.title{
  font-size:28px;
  font-weight:700;
  margin-bottom:6px;
}

.subtitle{
  color:#e5e7eb;
  font-size:14px;
  margin-bottom:28px;
}

/* ================= INPUT ================= */
.input{
  width:100%;
  padding:14px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.35);
  color:white;
  font-size:15px;
  outline:none;
  transition:.25s;
}

.input:focus{
  border-color:#c7a36b;
  box-shadow:0 0 0 3px rgba(199,163,107,.25);
}

/* ================= BUTTON ================= */
.btn{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#c7a36b;
  color:black;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}

.btn:hover{
  background:#b89355;
  transform:translateY(-1px);
}

/* ================= ERROR ================= */
.error{
  margin-top:14px;
  color:#f87171;
  font-size:13px;
  animation:shake .35s ease;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}

/* ================= FOOTER ================= */
.footer{
  margin-top:22px;
  font-size:12px;
  color:#d1d5db;
}

/* ================= MOBILE ================= */
@media (max-width:480px){
  .card{
    padding:36px 26px;
  }

  .title{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="wrap">
  <div class="card">

    <div class="lock">🔒</div>

    <div class="title">{{ gallery.title }}</div>
    <div class="subtitle">This gallery is password protected</div>

    <form method="POST">
      <input
        type="password"
        name="password"
        placeholder="Enter gallery password"
        class="input"
        required
        autofocus
      >

      <button class="btn">Unlock Gallery</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <div class="footer">
      Powered by PhotoShare
    </div>

  </div>
</div>

</body>
</html>
